{{- range $component := list "auth" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $.Values.namePrefix }}-{{ $component }}-private
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: {{ $.Values.namePrefix }}-{{ $component }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $caller := list "portal" "console" "admin-api" "smoke" "auth-smoke" }}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: {{ $.Values.namePrefix }}-{{ $caller }}}
        {{- end }}
      ports: [{protocol: TCP, port: 8443}]
{{- end }}
