{{- range $name, $m := .Values.migrations }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Values.namePrefix }}-migrate-{{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "saas-auth.image" (index $.Values.workloads $m.workload).image | quote }}
          command: {{ toJson $m.command }}
          envFrom: [{secretRef: {name: {{ $m.secret }}}}]
          {{- with $m.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext: {{ include "saas-auth.security" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: trust, mountPath: /run/trust, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: trust
          secret: {secretName: {{ $.Values.trustSecret }}}
{{- end }}
