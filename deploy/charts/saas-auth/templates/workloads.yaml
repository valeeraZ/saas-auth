{{- range $name, $w := .Values.workloads }}
{{- $full := printf "%s-%s" $.Values.namePrefix $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
spec:
  replicas: {{ $w.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app.kubernetes.io/name: {{ $full }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ $full }}}
      annotations:
        checksum/config: {{ toJson $w | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: {{ include "saas-auth.image" $w.image | quote }}
          {{- with $w.command }}
          command: {{ toJson . }}
          {{- end }}
          envFrom:
            - secretRef: {name: {{ $w.secret }}}
          env:
            - {name: HOME, value: /tmp}
            - {name: XDG_CACHE_HOME, value: /tmp/cache}
            - {name: SSL_CERT_FILE, value: /run/trust/ca-bundle.crt}
            {{- range $key, $value := $w.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $w.port }}
          ports: [{name: http, containerPort: {{ $w.port }}}]
          startupProbe:
            httpGet: {path: {{ $w.readyPath }}, port: http}
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 4
          readinessProbe:
            httpGet: {path: {{ $w.readyPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          {{- if $w.livePath }}
          livenessProbe:
            httpGet: {path: {{ $w.livePath }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          {{- else }}
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          {{- end }}
          {{- end }}
          resources: {{ toYaml $w.resources | nindent 12 }}
          securityContext: {{ include "saas-auth.security" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: trust, mountPath: /run/trust, readOnly: true}
        {{- if $w.tlsSecret }}
        - name: tls
          image: {{ include "saas-auth.image" $.Values.proxyImage | quote }}
          command: [nginx, -g, "daemon off;"]
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            tcpSocket: {port: https}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext: {{ include "saas-auth.security" . | nindent 12 }}
          volumeMounts:
            - {name: tls-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: proxy-tmp, mountPath: /tmp}
        {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: trust
          secret: {secretName: {{ $.Values.trustSecret }}}
        {{- if $w.tlsSecret }}
        - name: tls
          secret: {secretName: {{ $w.tlsSecret }}, defaultMode: 0440}
        - name: tls-config
          configMap: {name: {{ $full }}-tls}
        - {name: proxy-tmp, emptyDir: {}}
        {{- end }}
{{- if $w.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $full }}}
  ports:
    - name: {{ if $w.tlsSecret }}https{{ else }}http{{ end }}
      port: {{ if $w.tlsSecret }}443{{ else }}{{ $w.port }}{{ end }}
      targetPort: {{ if $w.tlsSecret }}https{{ else }}http{{ end }}
{{- end }}
{{- if $w.tlsSecret }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-tls
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 512; }
    http {
      access_log off;
      client_body_temp_path /tmp/client;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8443 ssl;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 9m;
        location / {
          proxy_pass http://127.0.0.1:{{ $w.port }};
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
        }
      }
    }
{{- end }}
{{- end }}
