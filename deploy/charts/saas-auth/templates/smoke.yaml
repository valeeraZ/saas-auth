apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.namePrefix }}-auth-smoke
  labels: {app.kubernetes.io/name: {{ .Values.namePrefix }}-auth-smoke}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets: {{ toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsUser: 10001
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: readiness
      image: {{ include "saas-auth.image" .Values.workloads.auth.image | quote }}
      command: [python, -c]
      args:
        - |
          import time
          import urllib.error
          import urllib.request
          urls = [
            "https://{{ .Values.namePrefix }}-auth.{{ .Release.Namespace }}.svc.cluster.local/health/ready",
          ]
          for url in urls:
              # New Pod network-policy rules may take a moment to become active.
              for attempt in range(15):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as response:
                          assert response.status == 200
                      break
                  except urllib.error.URLError:
                      if attempt == 14:
                          raise
                      time.sleep(2)
          print("PASS Auth readiness, with verified internal TLS")
      env: [{name: SSL_CERT_FILE, value: /run/trust/ca-bundle.crt}]
      securityContext: {{ include "saas-auth.security" . | nindent 8 }}
      resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {memory: 128Mi}}
      volumeMounts: [{name: trust, mountPath: /run/trust, readOnly: true}]
  volumes:
    - name: trust
      secret: {secretName: {{ .Values.trustSecret }}}
