name: Validate Auth
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: saas_auth
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: saas_auth_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U saas_auth" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      SAAS_TEST_DATABASE_URL: postgresql://saas_auth:local-test-only@127.0.0.1:5432/saas_auth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.11.7
      - run: uv sync --frozen
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.16.2
      - run: uv run mypy
      - run: uv run ruff check src tests scripts/prepare_local.py scripts/realm_users.py scripts/local_tls.py
      - run: uv run python scripts/validate_contracts.py
      - run: uv run pytest -q -m 'not keycloak'
      - run: SAAS_DATABASE_URL="$SAAS_TEST_DATABASE_URL" uv run alembic check
      - name: Start disposable Keycloak
        run: |
          uv run python scripts/prepare_local.py
          docker run -d --name auth-keycloak -p 127.0.0.1:58443:8443 \
            --add-host=host.docker.internal:host-gateway \
            -v "$PWD/.local/saas-local-realm.json:/opt/keycloak/data/import/saas-local-realm.json:ro" \
            -v "$PWD/.local/tls.crt:/opt/keycloak/conf/tls.crt:ro" \
            -v "$PWD/.local/tls.key:/opt/keycloak/conf/tls.key:ro" \
            quay.io/keycloak/keycloak:26.7.3@sha256:ff4257d0d64efbe99ed1ddfaf07765cc3c36dc7518bf8324d41961327f441c54 \
            start-dev --import-realm --hostname=https://127.0.0.1:58443 \
            --https-certificate-file=/opt/keycloak/conf/tls.crt \
            --https-certificate-key-file=/opt/keycloak/conf/tls.key
          for attempt in $(seq 1 60); do
            if curl --cacert .local/tls.crt -fsS https://127.0.0.1:58443/realms/saas-local/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify real user OIDC with local SMTP
        run: |
          set -a
          . ./.env
          set +a
          SSL_CERT_FILE="$PWD/.local/tls.crt" \
            SAAS_TEST_KEYCLOAK_ISSUER=https://127.0.0.1:58443/realms/saas-local \
            uv run pytest -q -m keycloak --tb=short
      - run: uv build
      - name: Verify installed wheel resources
        run: |
          uv venv /tmp/installed-auth
          uv pip install --python /tmp/installed-auth/bin/python dist/*.whl
          cd /tmp
          /tmp/installed-auth/bin/python -c 'from pathlib import Path; from saas_auth.api import create_app; from saas_auth.db.migrations import migration_config; from alembic.script import ScriptDirectory; assert ScriptDirectory.from_config(migration_config()).get_heads() == ["004_app_access_requests"]; assert Path(ScriptDirectory.from_config(migration_config()).dir, "script.py.mako").is_file()'
      - run: docker build -t saas-auth:ci .
      - name: Verify Compose startup and migration readiness
        run: |
          docker rm -f auth-keycloak
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:58000/health/ready
      - name: Clean disposable containers
        if: always()
        run: |
          docker rm -f auth-keycloak || true
          docker compose down --volumes --remove-orphans
