      #access-sequence-zh-CN-root { font-family: var(--font-sans); color: var(--color-ink); }
      #access-sequence-zh-CN-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#access-sequence-zh-CN-root .diagram-container { overflow-x: visible; }
