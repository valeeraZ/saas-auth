<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 504" role="img" aria-labelledby="logout-en-title logout-en-desc" id="logout-en-root"><title id="logout-en-title">What happens during logout</title><desc id="logout-en-desc">Auth commits local logout before contacting Keycloak. A 202 leaves a durable task for the worker to retry.</desc><defs>
      <style>#logout-en-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #logout-en-root { font-family: var(--font-sans); color: var(--color-ink); }
      #logout-en-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#logout-en-root .diagram-container { overflow-x: visible; }
}</style><marker id="logout-en-a" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#bf4520"/></marker><marker id="logout-en-b" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker><marker id="logout-en-m" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker></defs><rect x="0" y="0" width="960" height="504" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="28" y="42" text-anchor="start" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#2d3142">What happens during logout</text><path d="M288 146 H352" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#logout-en-m)"/><path d="M600 146 H672" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#logout-en-m)"/><path d="M820 188 V264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#logout-en-m)"/><path d="M752 188 V220 Q752 228 744 228 H484 Q476 228 476 236 V264" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#logout-en-m)"/><path d="M476 340 V400" fill="none" stroke="#4f5d75" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#logout-en-m)"/><path d="M612 438 H664" fill="none" stroke="#4f5d75" stroke-width="1.6" marker-end="url(#logout-en-m)"/><rect x="32" y="104" width="256" height="84" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="160.0" y="146.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">Current session</text><text x="160.0" y="168.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">DELETE /v1/sessions/current</text><rect x="352" y="104" width="248" height="84" rx="6" fill="#fcf1ed" stroke="#bf4520" stroke-width="1.5"/><text x="476.0" y="146.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#bf4520">Commit local logout</text><text x="476.0" y="168.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Revoke session and queue task</text><rect x="672" y="104" width="256" height="84" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="800.0" y="146.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">Contact Keycloak</text><text x="800.0" y="168.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Attempt upstream revocation</text><rect x="664" y="264" width="264" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="796.0" y="302.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">HTTP 204</text><text x="796.0" y="324.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Both sessions revoked</text><rect x="340" y="264" width="272" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="476.0" y="302.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">HTTP 202</text><text x="476.0" y="324.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Local logout is effective</text><text x="873" y="234" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">confirmed</text><text x="600" y="218" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">pending</text><rect x="340" y="400" width="272" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="476.0" y="438.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">Worker retries</text><text x="476.0" y="460.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Claim task when due</text><rect x="664" y="400" width="264" height="76" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.5"/><text x="796.0" y="438.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="600" fill="#2d3142">Complete task</text><text x="796.0" y="460.0" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#4f5d75">Clear encrypted payload</text></svg>
