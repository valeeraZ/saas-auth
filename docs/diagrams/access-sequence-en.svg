.25" y="288" width="239.5" height="20" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="252.0" y="304" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#2d3142">User ID, profile and status</text><rect x="111.0" y="340" width="282.0" height="20" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="252.0" y="356" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#2d3142">GET /v1/apps/{appId}/permissions</text><rect x="421.5" y="392" width="197.0" height="20" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="520.0" y="408" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#2d3142">Check upstream session</text><rect x="466.25" y="444" width="307.5" height="20" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="620.0" y="460" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#2d3142">Check session and read direct grant</text><rect x="115.25" y="496" width="273.5" height="20" rx="0" fill="#f5f5f5" stroke="none" stroke-width="1.5"/><text x="252.0" y="512" text-anchor="middle" font-family="Geist,Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="14" font-weight="400" fill="#2d3142">Access, roles, version and time</text></svg>
