      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #access-sequence-en-root { font-family: var(--font-sans); color: var(--color-ink); }
      #access-sequence-en-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#access-sequence-en-root .diagram-container { overflow-x: visible; }
