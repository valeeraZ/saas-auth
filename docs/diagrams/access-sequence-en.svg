<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" role="img" aria-labelledby="access-sequence-en-title access-sequence-en-desc" id="access-sequence-en-root"><title id="access-sequence-en-title">From sign-in to an app permission check</title><desc id="access-sequence-en-desc">Two authenticated Portal calls verify the upstream session, resolve the local user and read the grant for the requested app.</desc><defs>
      <style>#access-sequence-en-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
