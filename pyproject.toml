[project]
name = "saas-auth-service"
version = "0.2.0"
description = "User identity and application authorization service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "sqlalchemy>=2.0.22,<2.1",
  "alembic>=1.16,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "psycopg-pool>=3.2,<4",
    "ruff>=0.11,<1",
    "openapi-spec-validator==0.7.2",
    "jsonschema==4.23.0",
    "aiosmtpd>=1.4,<2",
    "mypy>=2.4,<3",
    "pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_auth"]

[project.scripts]
saas-auth = "saas_auth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["keycloak: requires the local Keycloak container"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
files = ["src/saas_auth"]
python_version = "3.11"
disallow_untyped_defs = true
