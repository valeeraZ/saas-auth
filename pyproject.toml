[project]
name = "saas-auth-service"
version = "0.1.0"
description = "Tenant identity and authorization service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "PyJWT[crypto]>=2.10.1,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "openapi-spec-validator==0.7.2", "jsonschema==4.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saas_auth"]

[project.scripts]
saas-auth = "saas_auth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["keycloak: requires the local Keycloak container"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
